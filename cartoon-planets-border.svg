<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90' viewBox='0 0 90 90'>
  <defs>
    <radialGradient id='saturnGrad' cx='35%' cy='35%' r='65%'>
      <stop offset='0%' stop-color='#fff3e0'/>
      <stop offset='50%' stop-color='#ffe082'/>
      <stop offset='100%' stop-color='#e65100'/>
    </radialGradient>
    <linearGradient id='ringGrad' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='rgba(215, 185, 140, 0.2)'/>
      <stop offset='40%' stop-color='rgba(230, 205, 160, 0.9)'/>
      <stop offset='55%' stop-color='rgba(140, 115, 85, 0.4)'/>
      <stop offset='70%' stop-color='rgba(235, 215, 175, 0.95)'/>
      <stop offset='100%' stop-color='rgba(215, 185, 140, 0.2)'/>
    </linearGradient>

    <!-- Single reusable planet (Saturn with rings) -->
    <g id='planet'>
      <!-- Back of ring -->
      <ellipse cx='0' cy='0' rx='13.5' ry='4.2' fill='none' stroke='url(#ringGrad)' stroke-width='2.2' transform='rotate(-22)' stroke-dasharray='27 27' stroke-dashoffset='13.5'/>
      <!-- Planet body -->
      <circle cx='0' cy='0' r='7' fill='url(#saturnGrad)'/>
      <!-- Front of ring -->
      <ellipse cx='0' cy='0' rx='13.5' ry='4.2' fill='none' stroke='url(#ringGrad)' stroke-width='2.2' transform='rotate(-22)' stroke-dasharray='27 27' stroke-dashoffset='0'/>
    </g>
  </defs>

  <!-- 8 border positions using the exact same planet -->
  <use href='#planet' x='15' y='15'/>
  <use href='#planet' x='45' y='15'/>
  <use href='#planet' x='75' y='15'/>

  <use href='#planet' x='15' y='45'/>
  <use href='#planet' x='75' y='45'/>

  <use href='#planet' x='15' y='75'/>
  <use href='#planet' x='45' y='75'/>
  <use href='#planet' x='75' y='75'/>
</svg>