<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90' viewBox='0 0 90 90'>
  <defs>
    <!-- 3D sphere gradient template -->
    <radialGradient id='earthGrad' cx='35%' cy='35%' r='65%'>
      <stop offset='0%' stop-color='#64b5f6'/>
      <stop offset='45%' stop-color='#1976d2'/>
      <stop offset='100%' stop-color='#0d47a1'/>
    </radialGradient>
    <radialGradient id='marsGrad' cx='35%' cy='35%' r='65%'>
      <stop offset='0%' stop-color='#ff8a65'/>
      <stop offset='60%' stop-color='#d84315'/>
      <stop offset='100%' stop-color='#4e1a0a'/>
    </radialGradient>
    <radialGradient id='jupiterGrad' cx='35%' cy='35%' r='65%'>
      <stop offset='0%' stop-color='#ffe0b2'/>
      <stop offset='40%' stop-color='#d7ccc8'/>
      <stop offset='70%' stop-color='#bcaaa4'/>
      <stop offset='100%' stop-color='#4e342e'/>
    </radialGradient>
    <radialGradient id='saturnGrad' cx='35%' cy='35%' r='65%'>
      <stop offset='0%' stop-color='#fff3e0'/>
      <stop offset='50%' stop-color='#ffe082'/>
      <stop offset='100%' stop-color='#ffb300'/>
    </radialGradient>
    <radialGradient id='neptuneGrad' cx='35%' cy='35%' r='65%'>
      <stop offset='0%' stop-color='#80d8ff'/>
      <stop offset='55%' stop-color='#0091ea'/>
      <stop offset='100%' stop-color='#013364'/>
    </radialGradient>
    <radialGradient id='moonGrad' cx='35%' cy='35%' r='65%'>
      <stop offset='0%' stop-color='#eeeeee'/>
      <stop offset='60%' stop-color='#9e9e9e'/>
      <stop offset='100%' stop-color='#424242'/>
    </radialGradient>
    <linearGradient id='ringGrad' x1='0%' y1='0%' x2='100%' y2='0%'>
      <stop offset='0%' stop-color='rgba(215, 185, 140, 0.2)'/>
      <stop offset='40%' stop-color='rgba(230, 205, 160, 0.85)'/>
      <stop offset='55%' stop-color='rgba(150, 130, 100, 0.4)'/>
      <stop offset='70%' stop-color='rgba(235, 215, 175, 0.9)'/>
      <stop offset='100%' stop-color='rgba(215, 185, 140, 0.2)'/>
    </linearGradient>
  </defs>

  <!-- Top-Left Corner: Saturn with realistic rings -->
  <g transform='translate(15, 15)'>
    <!-- Back of ring -->
    <ellipse cx='0' cy='0' rx='14' ry='4.5' fill='none' stroke='url(#ringGrad)' stroke-width='2.5' transform='rotate(-22)' stroke-dasharray='28 28' stroke-dashoffset='14'/>
    <!-- Saturn sphere -->
    <circle cx='0' cy='0' r='7.5' fill='url(#saturnGrad)'/>
    <!-- Front of ring -->
    <ellipse cx='0' cy='0' rx='14' ry='4.5' fill='none' stroke='url(#ringGrad)' stroke-width='2.5' transform='rotate(-22)' stroke-dasharray='28 28' stroke-dashoffset='0'/>
  </g>

  <!-- Top-Center: Realistic Earth with atmosphere & land -->
  <g transform='translate(45, 15)'>
    <circle cx='0' cy='0' r='7.5' fill='url(#earthGrad)'/>
    <!-- Continents -->
    <path d='M -2 -4 Q 0 -2 -1 1 Q -3 2 -2 4 Q 1 3 0 0 Q 3 -1 2 -4 Z' fill='#388e3c' opacity='0.75'/>
    <path d='M 3 -3 Q 4 0 2 2 Q 5 1 4 -2 Z' fill='#388e3c' opacity='0.75'/>
    <!-- Clouds -->
    <path d='M -5 -2 Q -1 -4 3 -3 Q 5 -1 2 0 Q -2 -1 -5 -2 Z' fill='#ffffff' opacity='0.55'/>
  </g>

  <!-- Top-Right Corner: Mars with polar cap -->
  <g transform='translate(75, 15)'>
    <circle cx='0' cy='0' r='6.5' fill='url(#marsGrad)'/>
    <!-- Dark surface patches -->
    <circle cx='-1' cy='1' r='2.5' fill='#3e1a0c' opacity='0.35'/>
    <circle cx='2' cy='-1' r='1.8' fill='#3e1a0c' opacity='0.35'/>
    <!-- Polar ice cap -->
    <ellipse cx='0' cy='-5.5' rx='2.5' ry='1' fill='#ffffff' opacity='0.85'/>
  </g>

  <!-- Left-Center: Jupiter with bands -->
  <g transform='translate(15, 45)'>
    <circle cx='0' cy='0' r='8.5' fill='url(#jupiterGrad)'/>
    <!-- Atmospheric belts -->
    <path d='M -8 -2.5 Q 0 -2 8 -2.5 L 8 -1 Q 0 -0.5 -8 -1 Z' fill='#8d6e63' opacity='0.6'/>
    <path d='M -8.2 1.5 Q 0 2 8.2 1.5 L 8.2 3 Q 0 3.5 -8.2 3 Z' fill='#8d6e63' opacity='0.6'/>
    <!-- Great Red Spot -->
    <ellipse cx='3' cy='2' rx='1.8' ry='1.2' fill='#d84315' opacity='0.75'/>
  </g>

  <!-- Right-Center: Moon -->
  <g transform='translate(75, 45)'>
    <circle cx='0' cy='0' r='6' fill='url(#moonGrad)'/>
    <!-- Craters -->
    <circle cx='-1.5' cy='-1' r='1.2' fill='#37474f' opacity='0.5'/>
    <circle cx='1.5' cy='1.5' r='1' fill='#37474f' opacity='0.5'/>
    <circle cx='1' cy='-2' r='0.8' fill='#37474f' opacity='0.5'/>
  </g>

  <!-- Bottom-Left Corner: Venus -->
  <g transform='translate(15, 75)'>
    <radialGradient id='venusGrad' cx='35%' cy='35%' r='65%'>
      <stop offset='0%' stop-color='#fffde7'/>
      <stop offset='50%' stop-color='#fff59d'/>
      <stop offset='100%' stop-color='#e65100'/>
    </radialGradient>
    <circle cx='0' cy='0' r='7' fill='url(#venusGrad)'/>
  </g>

  <!-- Bottom-Center: Neptune -->
  <g transform='translate(45, 75)'>
    <circle cx='0' cy='0' r='7.5' fill='url(#neptuneGrad)'/>
    <!-- Storm/cloud band -->
    <path d='M -7 1 Q 0 2 7 1' fill='none' stroke='#e1f5fe' stroke-width='0.8' opacity='0.7'/>
  </g>

  <!-- Bottom-Right Corner: Mercury -->
  <g transform='translate(75, 75)'>
    <radialGradient id='mercuryGrad' cx='35%' cy='35%' r='65%'>
      <stop offset='0%' stop-color='#cfd8dc'/>
      <stop offset='50%' stop-color='#90a4ae'/>
      <stop offset='100%' stop-color='#37474f'/>
    </radialGradient>
    <circle cx='0' cy='0' r='5.5' fill='url(#mercuryGrad)'/>
  </g>
</svg>