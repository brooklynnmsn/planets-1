<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90' viewBox='0 0 90 90'>
  <!-- Corner Top-Left: Saturn -->
  <g transform='translate(15, 15)'>
    <circle cx='0' cy='0' r='10' fill='#f4a261'/>
    <ellipse cx='0' cy='0' rx='14' ry='4' fill='none' stroke='#e76f51' stroke-width='2.5' transform='rotate(-20)'/>
  </g>
  <!-- Top-Center: Earth -->
  <g transform='translate(45, 15)'>
    <circle cx='0' cy='0' r='10' fill='#48cae4'/>
    <circle cx='-2' cy='-2' r='4' fill='#52b788'/>
    <circle cx='3' cy='3' r='3' fill='#52b788'/>
  </g>
  <!-- Corner Top-Right: Mars -->
  <g transform='translate(75, 15)'>
    <circle cx='0' cy='0' r='9' fill='#e63946'/>
    <circle cx='-2' cy='-2' r='2' fill='#d90429'/>
    <circle cx='3' cy='2' r='1.5' fill='#d90429'/>
  </g>
  <!-- Left-Center: Jupiter -->
  <g transform='translate(15, 45)'>
    <circle cx='0' cy='0' r='10' fill='#e9c46a'/>
    <line x1='-9' y1='-3' x2='9' y2='-3' stroke='#f4a261' stroke-width='2'/>
    <line x1='-9' y1='2' x2='9' y2='2' stroke='#e76f51' stroke-width='2'/>
  </g>
  <!-- Right-Center: Purple Ringed Planet -->
  <g transform='translate(75, 45)'>
    <circle cx='0' cy='0' r='9' fill='#b5179e'/>
    <ellipse cx='0' cy='0' rx='13' ry='3' fill='none' stroke='#7209b7' stroke-width='2' transform='rotate(15)'/>
  </g>
  <!-- Corner Bottom-Left: Moon -->
  <g transform='translate(15, 75)'>
    <circle cx='0' cy='0' r='8' fill='#ffd166'/>
    <circle cx='2' cy='-2' r='7' fill='#ffffff'/>
  </g>
  <!-- Bottom-Center: Neptune -->
  <g transform='translate(45, 75)'>
    <circle cx='0' cy='0' r='9' fill='#0077b6'/>
    <ellipse cx='0' cy='0' rx='12' ry='3' fill='none' stroke='#90e0ef' stroke-width='1.5'/>
  </g>
  <!-- Corner Bottom-Right: Venus -->
  <g transform='translate(75, 75)'>
    <circle cx='0' cy='0' r='9' fill='#f39c12'/>
    <circle cx='-1' cy='-1' r='2' fill='#f1c40f'/>
  </g>
</svg>
